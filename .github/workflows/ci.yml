name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  path-planner:
    name: Path planner
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --extra dev --frozen

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run path planner tests
        run: xvfb-run -a uv run --no-sync pytest tools/path_planner/tests/ tools/reorg/tests/ --ignore=tools/path_planner/tests/test_pathtracker_parity.py --ignore=tools/path_planner/tests/test_ctps_end_to_end.py -v

      - name: Verify generated routes are current
        run: |
          uv run --no-sync python tools/path_planner/build_routes.py --no-viz
          # Existence guard: git diff --exit-code exits 0 when the pathspec
          # matches nothing, so a stale path would pass vacuously. Fail loudly
          # if the emitted pair is missing before trusting the diff.
          test -f WRO2026/src/nav/routes.h && test -f WRO2026/src/nav/routes.cpp
          git diff --exit-code -- WRO2026/src/nav/routes.h WRO2026/src/nav/routes.cpp

      - name: Verify host-test routes fixture is current
        run: |
          uv run --no-sync python WRO2026/test/fixtures/regenerate_routes_fixture.py
          git diff --exit-code -- WRO2026/test/fixtures/routes_fixture.h WRO2026/test/fixtures/routes_fixture.cpp

      - name: Host-coverage + mirror guards
        run: python WRO2026/test/check_host_coverage.py

      - name: Include-resolvability + operator-root-set guard
        run: python tools/reorg/check_includes.py

  arduino-compile:
    name: Arduino compile
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno
          arduino-cli lib update-index
          arduino-cli lib install MatrixMiniR4 ArduinoBLE PubSubClient

      - name: Compile WRO2026 sketch (with SRAM ceiling gate)
        run: |
          set -o pipefail
          arduino-cli compile --fqbn arduino:renesas_uno:unor4wifi WRO2026 2>&1 | tee /tmp/arduino_compile.log
          # Flash-size gate (issue #156 / ADR-069): the ~30 KB `const EDGES[N][N]`
          # array must stay in flash .rodata. A flash->RAM demotion (e.g. a non-
          # constexpr makeEdge) would spike "Global variables" toward the 32 KB SRAM
          # budget. Pin a ceiling well below that -- baseline is ~18.7 KB, so 24000 B
          # leaves normal-growth headroom while a demotion of even a fraction of the
          # 30 KB array trips it. The constexpr canary in routes.h is the other guard.
          sram=$(grep -oE 'Global variables use [0-9]+ bytes' /tmp/arduino_compile.log | grep -oE '[0-9]+' | head -1)
          echo "SRAM (global variables) = ${sram:-<unparsed>} bytes (ceiling 24000)"
          if [ -z "$sram" ]; then
            echo "ERROR: could not parse the 'Global variables use N bytes' figure from the compile output."
            exit 1
          fi
          if [ "$sram" -gt 24000 ]; then
            echo "ERROR: SRAM ${sram} B exceeds the 24000 B ceiling -- the const EDGES array may have been demoted from flash .rodata to RAM (issue #156 flash-size gate)."
            exit 1
          fi

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure host-test harness
        run: cmake -S WRO2026/test -B build/test

      - name: Build host-test harness
        run: cmake --build build/test

      - name: Run host tests
        run: ctest --test-dir build/test --output-on-failure

  parity:
    name: Parity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --extra dev --frozen

      - name: Configure parity dump target
        run: cmake -S WRO2026/test -B build/parity

      - name: Build parity dump target
        run: cmake --build build/parity --target test_path_tracker_parity_dump

      - name: Capture C++ parity trace
        run: ./build/parity/test_path_tracker_parity_dump > build/parity/cpp_parity_trace.ndjson || true

      - name: Run parity pytest
        env:
          PARITY_DUMP_EXE: ${{ github.workspace }}/build/parity/test_path_tracker_parity_dump
        run: |
          # Without an explicit `shell: bash`, the default is `bash -e` WITHOUT
          # pipefail, so `pytest | tee` would mask a pytest failure behind tee's
          # exit 0. Set pipefail so a failing parity run actually fails the job.
          set -o pipefail
          uv run --no-sync pytest tools/path_planner/tests/test_pathtracker_parity.py -v 2>&1 \
            | tee build/parity/parity_pytest.log

      - name: Upload parity traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-traces
          path: |
            build/parity/cpp_parity_trace.ndjson
            build/parity/parity_pytest.log
          if-no-files-found: warn

  ctps-e2e:
    name: CTPS end-to-end
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --extra dev --frozen

      - name: Configure ctps_dump target
        run: cmake -S WRO2026/test -B build/ctps

      - name: Build ctps_dump target
        run: cmake --build build/ctps --target ctps_dump

      - name: Run CTPS end-to-end pytest
        env:
          CTPS_DUMP_EXE: ${{ github.workspace }}/build/ctps/ctps_dump
        run: uv run --no-sync pytest tools/path_planner/tests/test_ctps_end_to_end.py -v
