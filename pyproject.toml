[project]
name = "wro2026-path-planner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "matplotlib>=3.8",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]
